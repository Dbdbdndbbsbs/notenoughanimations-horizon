[mod]
id = "notenoughanimations"
version = "0.2.71"
priority = 100

# The commit it was tested on (the pin the launcher asks for).
[compatibility]
horizon_revision = "66f3981f522b24c250b21523a70080965b940424"

# The settings are the mod's own page; the animations live in a module
# inserted into the client's ambient file, applied after the vanilla setup.
[[module]]
id = "runtime"
file = "crates/horizon-client/src/game/client_ambient.rs"
name = "native_nea_runtime"
source = "runtime.rs"

[[module]]
id = "glue"
file = "crates/horizon-client/src/game/client_ambient.rs"
name = "native_nea_glue"
source = "glue.rs"

[[module]]
id = "anim"
file = "crates/horizon-client/src/mobs/anim.rs"
name = "native_nea_anim"
source = "nea_anim.rs"
visibility = "pub"

[[injection]]
id = "list"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_mods"
helper = "list.rs"
bindings = [
  { name = "mods", ty = "&mut Vec<crate::game::native_hooks::NativeMod>", value = "&mut *mods" },
]

[[injection]]
id = "settings"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_settings"
helper = "settings.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "mod_id", ty = "&str", value = "mod_id" },
  { name = "buttons", ty = "&mut Vec<String>", value = "&mut *buttons" },
]

[[injection]]
id = "click"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_settings_click"
helper = "click.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "mod_id", ty = "&str", value = "mod_id" },
  { name = "button", ty = "usize", value = "button" },
]

[[injection]]
id = "frame"
hook = "frame"
hook_version = 1
kind = "HEAD"
helper = "nea_frame.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
]

[[injection]]
id = "setup-head"
kind = "HEAD"
target = "horizon_client::mobs::anim::setup"
helper = "nea_setup_head.rs"
bindings = [
  { name = "m", ty = "&crate::mobs::Mob", value = "m" },
  { name = "s", ty = "&crate::mobs::anim::State", value = "s" },
]

[[injection]]
id = "visibility-head"
kind = "HEAD"
target = "horizon_client::mobs::anim::player_model_visibility"
helper = "nea_visibility_head.rs"
bindings = [
  { name = "p", ty = "&mut crate::mobs::anim::Poses", value = "p" },
]
